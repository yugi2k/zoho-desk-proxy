<body>

  <!-- Upgraded PIN Modal -->

        <svg width="28" height="28" fill="none" stroke="var(--accent)" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>

  <!-- MAIN HEADER -->

    <div class="header-actions">

          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </a>

        </button>

      <!-- Theme Toggle stays visible everywhere -->

  <div id="loginScreen">

  <div id="dashboardScreen">
    <div id="dashboardContainer">
      <div style="text-align: center; padding: 50px;" class="animate-in delay-1">

      </div>

  <footer>
    Powered by NovaForge AI | &copy; 2026 Mindmatrix | v1.2.0
  </footer>

  <script>
    // 🔴 IMPORTANT: PASTE YOUR GOOGLE WEB APP URL HERE
    const PROXY_URL = 'https://script.google.com/macros/s/AKfycbxQM4srD1CF0Zj63_CTwBraMp31MyWC1j9RRHoIe9d_RiVmROrYwI-9dO7NNgfa1fe5/exec';

    // Global variable to hold data for Alt+C shortcut
    window.allTicketsData = null;

    // --- EASTERN TIME UTILITIES ---
    // Forces midnight boundary checks to US Eastern Time (handling DST/EST shifts)
    function getMidnightET(year, month, day) {
      const shiftM = String(month).padStart(2, '0');
      const shiftD = String(day).padStart(2, '0');
      const t4 = new Date(`${year}-${shiftM}-${shiftD}T00:00:00-04:00`);
      const t5 = new Date(`${year}-${shiftM}-${shiftD}T00:00:00-05:00`);
      const fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hour12: false });
      const h4 = fmt.format(t4);
      return (h4 === '24' || h4 === '0' || h4 === '00') ? t4 : t5;
    }

    function getETMidnightForOffset(daysOffset) {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'}).formatToParts(now);
      const y = parseInt(parts.find(p=>p.type==='year').value, 10);
      const m = parseInt(parts.find(p=>p.type==='month').value, 10) - 1; 
      const d = parseInt(parts.find(p=>p.type==='day').value, 10);
      
      const dummy = new Date(Date.UTC(y, m, d + daysOffset));
      return getMidnightET(dummy.getUTCFullYear(), dummy.getUTCMonth() + 1, dummy.getUTCDate());
    }
    // ------------------------------

    // --- FORCE GOOGLE SSO TO RENDER ---
    // FIX: Changed from anonymous window.onload to named function called by Google script
    function renderGoogleButton() {
      if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: "801862906305-d2sbfbbcpih507cc8bot5sav1nlt8606.apps.googleusercontent.com",
          callback: handleGoogleLogin,
          context: "signin",
          ux_mode: "popup"
        });
        
        google.accounts.id.renderButton(
          document.getElementById("googleButtonContainer"),
          { theme: "outline", size: "large", type: "standard", shape: "rectangular", text: "signin_with" }
        );
      } else {
        console.warn("Google SSO script did not load.");
      }
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('themeIcon').textContent = '🌙';
      }
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      document.getElementById('themeIcon').textContent = isLight ? '🌙' : '☀️';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }

    function checkSession() {
      const authExpiry = localStorage.getItem('auth_expiry');
      if (authExpiry && Date.now() < parseInt(authExpiry)) {
        showDashboard();
      }
    }

    function logout() {
      localStorage.removeItem('auth_expiry');
      localStorage.removeItem('zoho_tickets_cache');
      localStorage.removeItem('zoho_data_timestamp');
      localStorage.removeItem('zoho_exact_stats');
      // FIX: Clean URL
      window.location.href = 'index';
    }

    function showDashboard() {
      // Set session to expire in 48 hours (48 hrs * 60 min * 60 sec * 1000 ms)
      localStorage.setItem('auth_expiry', Date.now() + (48 * 60 * 60 * 1000));
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboardScreen').style.display = 'block';
      
      // Reveal the navigation and logout buttons
      document.getElementById('securedNavButtons').style.display = 'flex'; 
      
      fetchData(); 
    }

    function showError(msg) {
      const errEl = document.getElementById('loginError');
      errEl.textContent = msg; errEl.style.display = 'block';
    }

    let pendingEmail = "";

    async function requestOTP() {
      const email = document.getElementById('emailInput').value.trim();
      const btn = document.querySelector('button[onclick="requestOTP()"]');
      if (!email.endsWith('@mindmatrix.net')) { showError('Access restricted to @mindmatrix.net emails.'); return; }
      document.getElementById('loginError').style.display = 'none'; btn.textContent = "Sending..."; btn.disabled = true;
      try {
        const response = await fetch(PROXY_URL, { method: 'POST', body: JSON.stringify({ action: 'sendOtp', email: email }) });
        const result = await response.json();
        if (result.error) throw new Error(result.error);
        pendingEmail = email; document.getElementById('otpStep2').style.display = 'block';
        document.getElementById('otpStep2').classList.add('animate-in'); btn.textContent = "OTP Sent!";
      } catch (err) { showError("Failed to send OTP."); btn.textContent = "Send OTP"; btn.disabled = false; }
    }

    async function verifyOTP() {
      const otp = document.getElementById('otpInput').value.trim();
      const btn = document.querySelector('button[onclick="verifyOTP()"]');
      if (!otp) return; btn.textContent = "Verifying..."; btn.disabled = true;
      try {
        const response = await fetch(PROXY_URL, { method: 'POST', body: JSON.stringify({ action: 'verifyOtp', email: pendingEmail, otp: otp }) });
        const result = await response.json();
        if (result.error) throw new Error(result.error);
        showDashboard();
      } catch (err) { showError("Invalid or expired OTP."); btn.textContent = "Login securely"; btn.disabled = false; }
    }

    function handleGoogleLogin(response) {
      const responsePayload = JSON.parse(atob(response.credential.split('.')[1]));
      if (responsePayload.email.endsWith('@mindmatrix.net')) showDashboard();
      else showError('Access denied. Must use a Mindmatrix Google account.');
    }

    function createStatCard(title, filterValue, statObj) {
      return `
        <a href="tickets?filter=timeframe&value=${filterValue}" class="metric-card glass-panel">
          <h3>${title}</h3>
          <p>${statObj.total}</p>
          <div class="stats-subtext">
            <span class="stats-open">Open: ${statObj.open}</span> &nbsp;|&nbsp; 
            <span class="stats-closed">Closed: ${statObj.closed}</span>
          </div>
        </a>`;
    }

    // --- PIN MODAL LOGIC ---
    function showPinModal() {
      const modal = document.getElementById('pinModal');
      if(modal) {
        modal.style.display = 'flex';
        document.getElementById('pinInput').value = '';
        setTimeout(() => document.getElementById('pinInput').focus(), 100);
      }
    }
    
    function closePinModal() {
      const modal = document.getElementById('pinModal');
      if(modal) modal.style.display = 'none';
    }

    const submitBtn = document.getElementById('submitPinBtn');
    if(submitBtn) {
      submitBtn.addEventListener('click', function() {
        const pin = document.getElementById('pinInput').value;
        closePinModal();
        fetchData(true, pin);
      });
    }

    document.addEventListener('keydown', function(event) {
      // Force Sync
      if (event.altKey && (event.key === 'r' || event.key === 'R')) {
        event.preventDefault();
        const authExpiry = localStorage.getItem('auth_expiry');
        if (authExpiry && Date.now() < parseInt(authExpiry)) showPinModal();
      }
      
      // Hidden Alt+C Copy Feature
      if (event.altKey && (event.key === 'c' || event.key === 'C')) {
        event.preventDefault();
        const authExpiry = localStorage.getItem('auth_expiry');
        if (authExpiry && Date.now() < parseInt(authExpiry) && window.allTicketsData) {
          copyMatrixToClipboard();
        }
      }
    });

// --- HIDDEN ALT+C FUNCTION (Now using exact Zoho Dashboard API numbers) ---
    function copyMatrixToClipboard() {
      // Retrieve the exactStats object from global memory
      const stats = window.exactStatsData;
      
      if (!stats) {
         alert("Exact stats missing. Please hit Alt+R to force a fresh sync (takes ~15s).");
         return;
      }

      const trackingDepts = [
        "Support", "Services", "Development", "Production", 
        "IT Requests", "Project Management", "Specialist Team", 
        "Billing", "Concierge Services", "SalesHelp"
      ];
      
      let copyString = "";
      trackingDepts.forEach(d => {
        // Fallback to 0 if the department stats somehow didn't load
        const s = stats[d] || { totalOpen: 0, yesterdayNew: 0, yesterdayClosed: 0 };
        copyString += `${s.totalOpen}\t${s.yesterdayNew}\t${s.yesterdayClosed}\t`;
      });
      
      // Remove trailing tab
      copyString = copyString.replace(/\t$/, '');

      navigator.clipboard.writeText(copyString).then(() => {
        alert("✅ Exact Zoho Reports Data copied to clipboard!\nReady to paste into Excel.");
      }).catch(err => alert("Copy failed: " + err));
    }
    // -----------------------

  async function fetchData(forceLive = false, pin = '') {
      const container = document.getElementById('dashboardContainer');
      const lastUpdatedEl = document.getElementById('lastUpdatedText');
      
      if (forceLive) {
        if(lastUpdatedEl) lastUpdatedEl.textContent = "⏱️ Forcing live sync from Zoho (Takes ~15s)...";
        container.innerHTML = `<div style="text-align: center; padding: 50px;" class="animate-in delay-1"><p style="color: var(--accent); font-size: 1.2rem; font-weight: 500;">Forcing live sync from Zoho... please wait.</p></div>`;
      }

      try {
        const now = Date.now();
        const cacheTimestamp = localStorage.getItem('zoho_data_timestamp');
        const cachedTickets = localStorage.getItem('zoho_tickets_cache');
        const cachedStats = localStorage.getItem('zoho_exact_stats');

        let tickets = [];
        let statsData = null;
        let lastUpdateMs = null;

        // --- THE CACHING ENGINE ---
        // If not forcing live, and cache is less than 15 mins old (900,000 ms), USE CACHE!
        if (!forceLive && cacheTimestamp && cachedTickets && (now - parseInt(cacheTimestamp) < 15 * 60 * 1000)) {
            tickets = JSON.parse(cachedTickets);
            statsData = cachedStats ? JSON.parse(cachedStats) : null;
            lastUpdateMs = parseInt(cacheTimestamp);
        } else {
            // Cache is old or missing. Fetch fresh from Proxy!
            const fetchUrl = forceLive ? `${PROXY_URL}?refresh=true&pin=${encodeURIComponent(pin)}` : PROXY_URL;
            const response = await fetch(fetchUrl, { method: 'GET' });
            const result = await response.json();
            
            if (result.error) {
              if (forceLive) { alert(result.error); window.location.reload(); return; }
              throw new Error(result.error);
            }
            
            tickets = result.data || [];
            statsData = result.exactStats;
            lastUpdateMs = result.lastUpdated || now;
            
            // Trim the fat & pre-format client names to save storage space (Prevents 5MB limit crash)
            const slimTickets = tickets.map(t => {
              let cName = "Unknown";
              if (t.customFields && t.customFields['Client Name']) cName = t.customFields['Client Name'];
              else if (t.cf && t.cf['Client Name']) cName = t.cf['Client Name'];
              else if (t['Client Name']) cName = t['Client Name'];
              else if (t.clientName) cName = t.clientName;
              else if (t.contact && t.contact.account && t.contact.account.accountName) cName = t.contact.account.accountName;
              else if (t.contact) cName = `${t.contact.firstName || ''} ${t.contact.lastName || ''}`.trim();

              return {
                id: t.id, ticketNumber: t.ticketNumber, subject: t.subject,
                status: t.status, priority: t.priority,
                department: t.department ? { name: t.department.name } : null,
                assignee: t.assignee ? { id: t.assignee.id, firstName: t.assignee.firstName, lastName: t.assignee.lastName, email: t.assignee.email } : null,
                createdTime: t.createdTime, closedTime: t.closedTime, modifiedTime: t.modifiedTime,
                clientName: cName || "Unknown"
              };
            });
            
            // Save to Local Cache
            localStorage.setItem('zoho_tickets_cache', JSON.stringify(slimTickets));
            if(statsData) localStorage.setItem('zoho_exact_stats', JSON.stringify(statsData));
            localStorage.setItem('zoho_data_timestamp', lastUpdateMs.toString());
            
            tickets = slimTickets; // Use the slimmed down versions to render
        }

        // Expose globally for Alt+C hook
        window.allTicketsData = tickets; 
        window.exactStatsData = statsData; 
        
        if (lastUpdateMs && lastUpdatedEl) {
          const formatter = new Intl.DateTimeFormat('en-US', { 
            timeZone: 'America/New_York', month: 'short', day: 'numeric', year: 'numeric', 
            hour: 'numeric', minute: '2-digit', hour12: true 
          });
          lastUpdatedEl.innerHTML = `⏱️ Last updated: ${formatter.format(new Date(lastUpdateMs))} ET`;
        }
        
        
        // --- US Eastern Time Boundaries ---
        const today = getETMidnightForOffset(0);
        const yesterday = getETMidnightForOffset(-1);
        const last7Days = getETMidnightForOffset(-7);
        const last30Days = getETMidnightForOffset(-30);

        const weekdayFmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short' }).format(new Date());
        const daysMap = { 'Sun': 0, 'Mon': 1, 'Tue': 2, 'Wed': 3, 'Thu': 4, 'Fri': 5, 'Sat': 6 };
        const currentWeekOffset = -daysMap[weekdayFmt];
        const currentWeek = getETMidnightForOffset(currentWeekOffset);
        const lastWeekStart = getETMidnightForOffset(currentWeekOffset - 7);
        const lastWeekEnd = currentWeek;

        const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit'}).formatToParts(new Date());
        const curY = parseInt(parts.find(p=>p.type==='year').value, 10);
        const curM = parseInt(parts.find(p=>p.type==='month').value, 10);
        const currentMonth = getMidnightET(curY, curM, 1);
        const lastMonthStart = getMidnightET(curM === 1 ? curY - 1 : curY, curM === 1 ? 12 : curM - 1, 1);
        const lastMonthEnd = currentMonth;
        // ----------------------------------

        const timeCounts = { today: 0, yesterday: 0, last7: 0, currentWeek: 0, lastWeek: 0, last30: 0, currentMonth: 0, lastMonth: 0 };
        const stats = {
          today: { total: 0, open: 0, closed: 0 }, yesterday: { total: 0, open: 0, closed: 0 },
          currentWeek: { total: 0, open: 0, closed: 0 }, lastWeek: { total: 0, open: 0, closed: 0 },
          last7: { total: 0, open: 0, closed: 0 }, currentMonth: { total: 0, open: 0, closed: 0 },
          lastMonth: { total: 0, open: 0, closed: 0 }, last30: { total: 0, open: 0, closed: 0 }
        };
        const deptCounts = {};
        const priorityCounts = {};

        tickets.forEach(ticket => {
          const tDate = new Date(ticket.createdTime);
          const closedDate = ticket.closedTime ? new Date(ticket.closedTime) : null;
          const status = ticket.status ? ticket.status.toLowerCase() : '';
          const isClosed = status.includes('close');
          
          // 1. Check CREATION events
          const incCreated = (key) => {
            stats[key].total++;
            if (!isClosed) stats[key].open++;
            if (!isClosed) timeCounts[key]++;
          };

          if (tDate >= today) incCreated('today');
          if (tDate >= yesterday && tDate < today) incCreated('yesterday');
          if (tDate >= last7Days) incCreated('last7');
          if (tDate >= currentWeek) incCreated('currentWeek');
          if (tDate >= lastWeekStart && tDate < lastWeekEnd) incCreated('lastWeek');
          if (tDate >= last30Days) incCreated('last30');
          if (tDate >= currentMonth) incCreated('currentMonth');
          if (tDate >= lastMonthStart && tDate < lastMonthEnd) incCreated('lastMonth');

          // 2. Check CLOSURE events independently
          const incClosed = (key) => { stats[key].closed++; };

          if (isClosed && closedDate) {
            if (closedDate >= today) incClosed('today');
            if (closedDate >= yesterday && closedDate < today) incClosed('yesterday');
            if (closedDate >= last7Days) incClosed('last7');
            if (closedDate >= currentWeek) incClosed('currentWeek');
            if (closedDate >= lastWeekStart && closedDate < lastWeekEnd) incClosed('lastWeek');
            if (closedDate >= last30Days) incClosed('last30');
            if (closedDate >= currentMonth) incClosed('currentMonth');
            if (closedDate >= lastMonthStart && closedDate < lastMonthEnd) incClosed('lastMonth');
          }

          // 3. Current Open Departments & Priorities
          if (!isClosed) {
            const deptName = ticket.department ? ticket.department.name : 'General';
            deptCounts[deptName] = (deptCounts[deptName] || 0) + 1;
            const priority = ticket.priority || 'None';
            priorityCounts[priority] = (priorityCounts[priority] || 0) + 1;
          }
        });

        const openTicketsOnly = tickets.filter(t => !((t.status || '').toLowerCase().includes('close')));

        let html = `
          <div class="dashboard-grid animate-in delay-1" style="margin-bottom: 30px;">
            <a href="tickets?filter=all" class="metric-card glass-panel total-card">
              <h3>Total Open Tickets (Current Backlog)</h3>
              <p>${openTicketsOnly.length}</p>
            </a>
          </div>

          <div class="section-title animate-in delay-1">Ticket Volumes (Open Only)</div>
          <div class="dashboard-grid animate-in delay-2" style="margin-bottom: 30px;">
            <a href="tickets?filter=timeframe&value=today" class="metric-card glass-panel"><h3>Today</h3><p>${timeCounts.today}</p></a>
            <a href="tickets?filter=timeframe&value=yesterday" class="metric-card glass-panel"><h3>Yesterday</h3><p>${timeCounts.yesterday}</p></a>
            <a href="tickets?filter=timeframe&value=currentWeek" class="metric-card glass-panel"><h3>This Week</h3><p>${timeCounts.currentWeek}</p></a>
            <a href="tickets?filter=timeframe&value=lastWeek" class="metric-card glass-panel"><h3>Last Week</h3><p>${timeCounts.lastWeek}</p></a>
            <a href="tickets?filter=timeframe&value=last7" class="metric-card glass-panel"><h3>Last 7 Days</h3><p>${timeCounts.last7}</p></a>
            <a href="tickets?filter=timeframe&value=currentMonth" class="metric-card glass-panel"><h3>This Month</h3><p>${timeCounts.currentMonth}</p></a>
            <a href="tickets?filter=timeframe&value=lastMonth" class="metric-card glass-panel"><h3>Last Month</h3><p>${timeCounts.lastMonth}</p></a>
            <a href="tickets?filter=timeframe&value=last30" class="metric-card glass-panel"><h3>Last 30 Days</h3><p>${timeCounts.last30}</p></a>
          </div>

          <div class="section-title animate-in delay-1">Ticket Stats (All Open & Closed)</div>
          <div class="dashboard-grid animate-in delay-2">
            ${createStatCard('Today', 'today', stats.today)}
            ${createStatCard('Yesterday', 'yesterday', stats.yesterday)}
            ${createStatCard('This Week', 'currentWeek', stats.currentWeek)}
            ${createStatCard('Last Week', 'lastWeek', stats.lastWeek)}
            ${createStatCard('Last 7 Days', 'last7', stats.last7)}
            ${createStatCard('This Month', 'currentMonth', stats.currentMonth)}
            ${createStatCard('Last Month', 'lastMonth', stats.lastMonth)}
            ${createStatCard('Last 30 Days', 'last30', stats.last30)}
          </div>

          <div class="section-title animate-in delay-2">Open Tickets By Priority</div>
          <div class="dashboard-grid animate-in delay-3">
        `;
        
        Object.entries(priorityCounts).forEach(([priority, count]) => {
          if (count > 0) {
            let bgColor = '#94a3b8'; let textColor = '#ffffff';
            const p = priority.toLowerCase();
            if (p.includes('low')) { bgColor = '#86efac'; textColor = '#0f172a'; } 
            else if (p.includes('medium')) { bgColor = '#fde047'; textColor = '#0f172a'; } 
            else if (p.includes('high')) { bgColor = '#f97316'; textColor = '#ffffff'; } 
            else if (p.includes('urgent')) { bgColor = '#fca5a5'; textColor = '#0f172a'; } 
            else if (p.includes('critical')) { bgColor = '#ef4444'; textColor = '#ffffff'; } 

            html += `<a href="tickets?filter=priority&value=${encodeURIComponent(priority)}" class="metric-card glass-panel"><div><span class="priority-badge" style="background-color: ${bgColor}; color: ${textColor};">${priority}</span></div><p>${count}</p></a>`;
          }
        });
        
        html += `</div><div class="section-title animate-in delay-3">Open Tickets By Department</div><div class="dashboard-grid animate-in delay-3" style="margin-bottom: 20px;">`;
        Object.entries(deptCounts).forEach(([dept, count]) => {
          html += `<a href="tickets?filter=department&value=${encodeURIComponent(dept)}" class="metric-card glass-panel"><h3>${dept}</h3><p>${count}</p></a>`;
        });
        html += `</div>`;
        
        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = `<div class="glass-panel animate-in" style="padding:30px; text-align:center; color: #ef4444;">Error: ${err.message}</div>`;
      }
    }

    initTheme();
    checkSession();
  </script>
</body>
</html>
