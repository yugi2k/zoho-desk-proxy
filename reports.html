<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk Portal | Reports</title>
  
  <link rel="icon" href="https://www.google.com/s2/favicons?domain=mindmatrix.net&sz=128" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    // 48-Hour Secure Session Check & Clean URL Redirect
    const authExpiry = localStorage.getItem('auth_expiry');
    if (!authExpiry || Date.now() > parseInt(authExpiry)) {
      localStorage.removeItem('auth_expiry');
      window.location.href = 'index';
    }
  </script>

  <!-- The Master Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Injecting specific CSS for the new UI elements -->
  <style>
    .controls-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 15px;
    }
    
    .filters-group {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .custom-select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background-color: var(--glass-bg, rgba(255, 255, 255, 0.7));
      color: inherit;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    .dark-mode .custom-select { background-color: rgba(30, 41, 59, 0.7); }

    .toggle-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px; width: 18px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #3b82f6; }
    input:checked + .slider:before { transform: translateX(20px); }

    .metric-card {
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 2px solid transparent;
    }
    .metric-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    .metric-card.active-filter {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.05);
    }
    
    .loading-spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 1s ease-in-out infinite;
      margin-left: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header-container animate-in">
    <div class="title-group">
      <a href="index" class="btn-back">← Dashboard</a>
      <div style="display: flex; flex-direction: column; justify-content: center;">
        <h1 id="pageTitle" style="display: flex; align-items: center; gap: 10px; margin: 0;">
          <img src="https://www.google.com/s2/favicons?domain=mindmatrix.net&sz=128" alt="Mindmatrix" class="brand-logo">
          Reports Dashboard
        </h1>
      </div>
    </div>
    
    <div class="header-actions">
      <a href="agents" class="icon-btn" title="Agents">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      </a>
      <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
        <span id="themeIcon">☀️</span>
      </button>
      <button class="icon-btn logout-btn" onclick="logout()" title="Logout">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      </button>
    </div>
  </div>

  <div class="controls-container animate-in delay-1">
    <div class="filters-group">
      <select id="departmentFilter" class="custom-select" onchange="handleStateChange()">
        <option value="All">All Departments</option>
        <option value="Support">Support</option>
        <option value="Services">Services</option>
        <option value="Development">Development</option>
        <option value="Production">Production</option>
        <option value="IT Requests">IT Requests</option>
        <option value="Project Management">Project Management</option>
        <option value="Specialist Team">Specialist Team</option>
        <option value="Billing">Billing</option>
        <option value="Concierge Services">Concierge Services</option>
        <option value="SalesHelp">SalesHelp</option>
      </select>

      <select id="timeframeFilter" class="custom-select" onchange="handleStateChange()">
        <option value="All">Any Update Time</option>
        <option value="14">No Updates > 2 Weeks</option>
        <option value="30">No Updates > 30 Days</option>
        <option value="60">No Updates > 60 Days</option>
      </select>
    </div>
    
    <div class="toggle-wrapper">
      <span>90-Day History</span>
      <label class="switch">
        <input type="checkbox" id="historyToggle" onchange="handleToggleChange()">
        <span class="slider"></span>
      </label>
      <span id="loadingIndicator" style="display:none;" class="loading-spinner"></span>
    </div>
  </div>

  <div class="section-title animate-in delay-1" id="cardsTitle">Global Priority Distribution (Open Tickets)</div>
  <div class="dashboard-grid animate-in delay-1" id="priorityCardsContainer">
    <!-- Rendered via JS -->
  </div>

  <div class="section-title animate-in delay-1">Ticket Log <span id="filterSubtext" style="font-weight:normal; font-size:0.9rem; color:#888;"></span></div>
  <div class="table-container glass-panel animate-in delay-1">
    <table>
      <thead id="reportsTableHeader">
        <!-- Rendered via JS -->
      </thead>
      <tbody id="reportsTableBody">
        <tr><td colspan="9" style="padding:40px;text-align:center;">Compiling reports...</td></tr>
      </tbody>
    </table>
  </div>
  
  <footer>Powered by NovaForge AI | &copy; 2026 Mindmatrix | v1.2.0</footer>

  <script>
    // State Management
    const appState = {
      isHistoryMode: false,
      selectedDepartment: 'All',
      timeframeFilter: 'All', 
      activePriorityFilter: null
    };

    let liveData = [];
    let historyData = [];
    const SHEET_ID = '1deeBJssfGAT46PbP7HQTe3wQefj-roBfPboOEATy1Kk';

    // UI Boilerplate
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('themeIcon').textContent = '🌙';
      }
    }
    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      document.getElementById('themeIcon').textContent = isLight ? '🌙' : '☀️';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }
    function logout() {
      localStorage.removeItem('auth_expiry');
      localStorage.removeItem('zoho_tickets_cache');
      localStorage.removeItem('zoho_data_timestamp');
      localStorage.removeItem('zoho_exact_stats');
      window.location.href = 'index';
    }

    // Load Live Data (From cache)
    function loadInitialData() {
      const cache = localStorage.getItem('zoho_tickets_cache');
      if (cache) {
        liveData = JSON.parse(cache);
      }
      renderDashboard();
    }

    // Fetch History Data (From Google Sheets)
    async function fetchHistoricalData() {
      if (historyData.length > 0) return; 
      
      const loader = document.getElementById('loadingIndicator');
      loader.style.display = 'inline-block';
      
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
        const res = await fetch(url);
        const text = await res.text();
        
        const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonString);
        
        const getV = (row, idx) => (row.c && row.c[idx] && row.c[idx].v) ? row.c[idx].v : null;

        historyData = data.table.rows.map(row => ({
          id: getV(row, 0),
          ticketNumber: getV(row, 1),
          subject: getV(row, 2),
          department: { name: getV(row, 3) },
          assignee: { lastName: getV(row, 4) },
          status: getV(row, 5),
          priority: getV(row, 6),
          createdTime: getV(row, 7),
          closedTime: getV(row, 8),
          resolutionTime: getV(row, 9),
          modifiedTime: getV(row, 10) // Mapped Column
        }));
        
      } catch (err) {
        alert("Failed to load historical data from Google Sheets.");
        console.error(err);
      } finally {
        loader.style.display = 'none';
      }
    }

    // Handle User Interactions
    async function handleToggleChange() {
      appState.isHistoryMode = document.getElementById('historyToggle').checked;
      appState.activePriorityFilter = null; 
      
      if (appState.isHistoryMode) {
        document.getElementById('cardsTitle').innerText = "Global Priority Distribution (Last 90 Days)";
        await fetchHistoricalData();
      } else {
        document.getElementById('cardsTitle').innerText = "Global Priority Distribution (Open Tickets)";
      }
      renderDashboard();
    }

    function handleStateChange() {
      appState.selectedDepartment = document.getElementById('departmentFilter').value;
      appState.timeframeFilter = document.getElementById('timeframeFilter').value; 
      appState.activePriorityFilter = null; 
      renderDashboard();
    }

    function togglePriorityFilter(priorityValue) {
      if (appState.activePriorityFilter === priorityValue) {
        appState.activePriorityFilter = null; 
      } else {
        appState.activePriorityFilter = priorityValue;
      }
      renderDashboard();
    }

    // Master Render Function
    function renderDashboard() {
      let currentData = appState.isHistoryMode ? historyData : liveData;
      
      if (!currentData || currentData.length === 0) {
        document.getElementById('reportsTableBody').innerHTML = `<tr><td colspan="9" style="color:#ef4444; text-align:center;">No data found. Ensure cache is loaded from Dashboard.</td></tr>`;
        return;
      }

      // Filter by Department
      if (appState.selectedDepartment !== 'All') {
        currentData = currentData.filter(t => {
           const deptName = t.department ? (t.department.name || '') : '';
           return deptName.toLowerCase().includes(appState.selectedDepartment.toLowerCase());
        });
      }

      // Filter by Stale Timeframe (Updated days ago)
      if (appState.timeframeFilter !== 'All') {
        const days = parseInt(appState.timeframeFilter, 10);
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - days);
        
        currentData = currentData.filter(t => {
           // Robust fallback logic to prevent zero-data bugs
           const refTime = t.agentRespondedTime || t.modifiedTime || t.createdTime;
           if (!refTime) return false;
           return new Date(refTime) < cutoff;
        });
      }

      // Filter out closed tickets if we are in LIVE (toggle off) mode
      if (!appState.isHistoryMode) {
         currentData = currentData.filter(t => !(t.status || '').toLowerCase().includes('close'));
      }

      // Calculate Priorities 
      const priorityCounts = { "Critical": 0, "Urgent": 0, "High": 0, "Medium": 0, "Low": 0, "None": 0 };
      
      currentData.forEach(t => {
        const prio = t.priority ? t.priority.toLowerCase() : 'none';
        if (prio.includes('critical')) priorityCounts["Critical"]++;
        else if (prio.includes('urgent')) priorityCounts["Urgent"]++;
        else if (prio.includes('high')) priorityCounts["High"]++;
        else if (prio.includes('medium')) priorityCounts["Medium"]++;
        else if (prio.includes('low')) priorityCounts["Low"]++;
        else priorityCounts["None"]++;
      });

      // Render Priority Cards
      let prioHtml = '';
      const colors = { "Critical": "#ef4444", "Urgent": "#fca5a5", "High": "#f97316", "Medium": "#fde047", "Low": "#86efac", "None": "#94a3b8" };
      Object.entries(priorityCounts).forEach(([p, count]) => {
        if(count > 0 || p !== "None") { 
          const textC = (p === 'Medium' || p === 'Low' || p === 'Urgent') ? '#0f172a' : '#fff';
          const isActive = appState.activePriorityFilter === p ? 'active-filter' : '';
          
          prioHtml += `
            <div class="metric-card glass-panel ${isActive}" onclick="togglePriorityFilter('${p}')">
              <div><span class="priority-badge" style="background-color:${colors[p]}; color:${textC};">${p}</span></div>
              <p>${count}</p>
            </div>`;
        }
      });
      document.getElementById('priorityCardsContainer').innerHTML = prioHtml;

      // Filter by Priority
      let tableData = currentData;
      if (appState.activePriorityFilter) {
        document.getElementById('filterSubtext').innerText = `(Filtered by ${appState.activePriorityFilter})`;
        tableData = tableData.filter(t => {
          const p = t.priority ? t.priority.toLowerCase() : 'none';
          if (appState.activePriorityFilter === "None") return p === 'none';
          return p.includes(appState.activePriorityFilter.toLowerCase());
        });
      } else {
        document.getElementById('filterSubtext').innerText = "";
      }

      // Render Table Headers
      const thead = document.getElementById('reportsTableHeader');
      if (appState.isHistoryMode) {
        thead.innerHTML = `
          <tr>
            <th>Ticket #</th>
            <th>Subject</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Assignee</th>
            <th>Agent Responded Time</th>
            <th>Created Date</th>
            <th>Closed Date</th>
            <th>Resolution (Hrs)</th>
          </tr>`;
      } else {
        thead.innerHTML = `
          <tr>
            <th>Ticket #</th>
            <th>Subject</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Assignee</th>
            <th>Agent Responded Time</th>
            <th>Created Date</th>
          </tr>`;
      }

      // Render Table Body
      const tbody = document.getElementById('reportsTableBody');
      tbody.innerHTML = '';
      
      if(tableData.length === 0) {
        const colCount = appState.isHistoryMode ? 9 : 7;
        tbody.innerHTML = `<tr><td colspan="${colCount}" style="padding:40px; text-align:center; color: var(--text-muted);">No tickets match the selected filters.</td></tr>`;
        return;
      }

      const tableDateFmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: 'numeric' });

      tableData.forEach(t => {
        const prio = t.priority || '-';
        const assignee = t.assignee ? (t.assignee.lastName || t.assignee.firstName || 'Unassigned').trim() : 'Unassigned';
        
        let created = '-';
        if (t.createdTime) {
           const d = new Date(t.createdTime);
           created = isNaN(d.getTime()) ? t.createdTime : tableDateFmt.format(d);
        }

        // Includes fallback to ensure column always renders even if cache is temporarily stale
        let responded = '-';
        const respondedData = t.agentRespondedTime || t.modifiedTime || t.createdTime;
        if (respondedData) {
           const d = new Date(respondedData);
           responded = isNaN(d.getTime()) ? respondedData : tableDateFmt.format(d);
        }

        let bg = '#94a3b8'; let tc = '#ffffff'; const pStr = prio.toLowerCase();
        if (pStr.includes('low')) { bg = '#86efac'; tc = '#0f172a'; } 
        else if (pStr.includes('medium')) { bg = '#fde047'; tc = '#0f172a'; } 
        else if (pStr.includes('high')) { bg = '#f97316'; tc = '#ffffff'; } 
        else if (pStr.includes('urgent')) { bg = '#fca5a5'; tc = '#0f172a'; } 
        else if (pStr.includes('critical')) { bg = '#ef4444'; tc = '#ffffff'; } 
        const pHtml = prio !== '-' ? `<span class="priority-badge" style="background-color:${bg}; color:${tc};">${prio}</span>` : prio;

        // FIXED: Using Custom Mindmatrix URL Domain
        const ticketLink = `https://helpdesk.mindmatrix.net/support/mindmatrixinc/ShowHomePage.do#Cases/dv/${t.id}`;

        let tr = document.createElement('tr');
        
        let rowHtml = `
          <td><a href="${ticketLink}" target="_blank" class="ticket-link">#${t.ticketNumber}</a></td>
          <td><strong>${t.subject}</strong></td>
          <td>${pHtml}</td>
          <td>${t.status || '-'}</td>
          <td>${assignee}</td>
          <td>${responded}</td>
          <td>${created}</td>
        `;

        if (appState.isHistoryMode) {
          let closed = '-';
          if (t.closedTime) {
             const cd = new Date(t.closedTime);
             closed = isNaN(cd.getTime()) ? t.closedTime : tableDateFmt.format(cd);
          }
          rowHtml += `
            <td>${closed}</td>
            <td><strong>${t.resolutionTime || '-'}</strong></td>
          `;
        }

        tr.innerHTML = rowHtml;
        tbody.appendChild(tr);
      });
    }

    // Initialize Page
    initTheme();
    loadInitialData();
  </script>
</body>
</html>
