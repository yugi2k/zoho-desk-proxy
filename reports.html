<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk Portal | Reports</title>
  
  <link rel="icon" href="https://www.google.com/s2/favicons?domain=mindmatrix.net&sz=128" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    if (sessionStorage.getItem('auth_session') !== 'active') {
      window.location.href = 'index.html';
    }
  </script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 15% 50%, #1e1b4b, #0f172a, #020617);
      --glass-bg: rgba(30, 41, 59, 0.4);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --row-hover: rgba(255, 255, 255, 0.05);
      --th-bg: rgba(15, 23, 42, 0.4);
    }
    
    body.light-mode {
      --bg-gradient: radial-gradient(circle at 15% 50%, #e0e7ff, #f1f5f9, #f8fafc);
      --glass-bg: rgba(255, 255, 255, 0.6);
      --glass-border: rgba(255, 255, 255, 0.6);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      --text-main: #0f172a;
      --text-muted: #475569;
      --row-hover: rgba(0, 0, 0, 0.02);
      --th-bg: rgba(255, 255, 255, 0.4);
    }

    body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); margin: 0; padding: 2rem; min-height: 100vh; display: flex; flex-direction: column; }
    
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .delay-1 { animation-delay: 0.1s; opacity: 0; }

    .glass-panel { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: 16px; }

    /* Standardized Header */
    .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 20px; }
    .title-group { display: flex; align-items: center; gap: 15px; }
    .brand-logo { height: 28px; border-radius: 4px; }
    h1 { margin: 0; font-size: 1.6rem; font-weight: 700; display: flex; align-items: center; gap: 10px;}
    
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .icon-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; width: 40px; height: 40px; padding: 0; box-sizing: border-box; text-decoration: none; line-height: 0; }
    .icon-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
    .icon-btn svg { width: 18px; height: 18px; display: block; }
    #themeIcon { font-size: 1.1rem; line-height: 1; display: block; margin-top: 2px; }
    
    .btn-back { background: var(--glass-bg); color: var(--text-main); border: 1px solid var(--glass-border); padding: 8px 16px; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; transition: all 0.3s; }
    .btn-back:hover { background: rgba(255,255,255,0.1); transform: translateX(-4px); }

    /* Dashboard Metrics */
    .section-title { font-size: 1rem; color: var(--text-muted); margin: 30px 0 20px 0; text-transform: uppercase; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .metric-card { padding: 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .metric-card h3 { margin: 0; font-size: 0.9rem; font-weight: 500; color: var(--text-muted); text-transform: uppercase;}
    .metric-card p { margin: 12px 0 0 0; font-size: 2.5rem; font-weight: 700; color: var(--text-main); }
    
    .priority-badge { color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }

    /* Table */
    .table-container { overflow-x: auto; border-radius: 16px; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 16px 20px; border-bottom: 1px solid var(--glass-border); font-size: 0.9rem; }
    th { background-color: var(--th-bg); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.8rem; }
    tr { transition: background 0.2s ease; }
    tr:hover { background-color: var(--row-hover); }
    .ticket-link { color: var(--accent); text-decoration: none; font-weight: 600; }
    .ticket-link:hover { text-decoration: underline; }

    footer { text-align: center; padding: 30px 0 10px 0; color: var(--text-muted); font-size: 0.8rem; margin-top: auto; }
  </style>
</head>
<body>

  <div class="header-container animate-in">
    <div class="title-group">
      <a href="index.html" class="btn-back">← Dashboard</a>
      <div style="display: flex; flex-direction: column; justify-content: center;">
        <h1 id="pageTitle" style="display: flex; align-items: center; gap: 10px; margin: 0;">
          <img src="https://www.google.com/s2/favicons?domain=mindmatrix.net&sz=128" alt="Mindmatrix" class="brand-logo">
          Reports Dashboard
        </h1>
      </div>
    </div>
    
    <div class="header-actions">
      <a href="reports.html" class="icon-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
      </a>
      <a href="agents.html" class="icon-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      </a>
      <button class="icon-btn theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">☀️</span>
      </button>
      <button class="icon-btn logout-btn" onclick="logout()">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      </button>
    </div>
  </div>

  <div class="section-title animate-in delay-1">Global Priority Distribution (Open Tickets)</div>
  <div class="dashboard-grid animate-in delay-1" id="priorityCardsContainer">
    <!-- Rendered via JS -->
  </div>

  <div class="section-title animate-in delay-1">Global Ticket Log</div>
  <div class="table-container glass-panel animate-in delay-1">
    <table>
      <thead>
        <tr>
          <th>Ticket #</th>
          <th>Subject</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Assignee</th>
          <th>Created Date</th>
        </tr>
      </thead>
      <tbody id="reportsTableBody">
        <tr><td colspan="6" style="padding:40px;text-align:center;">Compiling reports...</td></tr>
      </tbody>
    </table>
  </div>
  
  <footer>Powered by NovaForge AI | &copy; 2026 Mindmatrix | v1.2.0</footer>

  <script>
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('themeIcon').textContent = '🌙';
      }
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      document.getElementById('themeIcon').textContent = isLight ? '🌙' : '☀️';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }

    function logout() {
      sessionStorage.removeItem('auth_session');
      window.location.href = 'index.html';
    }

    function loadReportsData() {
      const cache = sessionStorage.getItem('zoho_tickets_cache');
      if (!cache) {
        document.getElementById('reportsTableBody').innerHTML = `<tr><td colspan="6" style="color:#ef4444; text-align:center;">No data found. Please load the Main Dashboard first.</td></tr>`;
        return;
      }
      
      const allTickets = JSON.parse(cache);
      
      // Calculate Priorities for OPEN tickets only
      const priorityCounts = { "Critical": 0, "Urgent": 0, "High": 0, "Medium": 0, "Low": 0, "None": 0 };
      
      allTickets.forEach(t => {
        const isClosed = (t.status || '').toLowerCase().includes('close');
        if (!isClosed) {
          const prio = t.priority ? t.priority.toLowerCase() : 'none';
          if (prio.includes('critical')) priorityCounts["Critical"]++;
          else if (prio.includes('urgent')) priorityCounts["Urgent"]++;
          else if (prio.includes('high')) priorityCounts["High"]++;
          else if (prio.includes('medium')) priorityCounts["Medium"]++;
          else if (prio.includes('low')) priorityCounts["Low"]++;
          else priorityCounts["None"]++;
        }
      });

      // Render Cards
      let prioHtml = '';
      const colors = { "Critical": "#ef4444", "Urgent": "#fca5a5", "High": "#f97316", "Medium": "#fde047", "Low": "#86efac", "None": "#94a3b8" };
      Object.entries(priorityCounts).forEach(([p, count]) => {
        if(count > 0 || p !== "None") { // Always show main priorities, hide 'None' if 0
          const textC = (p === 'Medium' || p === 'Low' || p === 'Urgent') ? '#0f172a' : '#fff';
          prioHtml += `
            <div class="metric-card glass-panel">
              <div><span class="priority-badge" style="background-color:${colors[p]}; color:${textC};">${p}</span></div>
              <p>${count}</p>
            </div>`;
        }
      });
      document.getElementById('priorityCardsContainer').innerHTML = prioHtml;

      // Render Table
      const tableDateFmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric', year: 'numeric' });
      const tbody = document.getElementById('reportsTableBody');
      tbody.innerHTML = '';

      allTickets.forEach(t => {
        const prio = t.priority || '-';
        const assignee = t.assignee ? `${t.assignee.firstName || ''} ${t.assignee.lastName || ''}`.trim() : 'Unassigned';
        const created = t.createdTime ? tableDateFmt.format(new Date(t.createdTime)) : '-';

        let bg = '#94a3b8'; let tc = '#ffffff'; const pStr = prio.toLowerCase();
        if (pStr.includes('low')) { bg = '#86efac'; tc = '#0f172a'; } 
        else if (pStr.includes('medium')) { bg = '#fde047'; tc = '#0f172a'; } 
        else if (pStr.includes('high')) { bg = '#f97316'; tc = '#ffffff'; } 
        else if (pStr.includes('urgent')) { bg = '#fca5a5'; tc = '#0f172a'; } 
        else if (pStr.includes('critical')) { bg = '#ef4444'; tc = '#ffffff'; } 
        const pHtml = prio !== '-' ? `<span class="priority-badge" style="background-color:${bg}; color:${tc};">${prio}</span>` : prio;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><a href="https://helpdesk.mindmatrix.net/support/mindmatrixinc/ShowHomePage.do#Cases/dv/${t.id}" target="_blank" class="ticket-link">#${t.ticketNumber}</a></td>
          <td><strong>${t.subject}</strong></td>
          <td>${pHtml}</td>
          <td>${t.status || '-'}</td>
          <td>${assignee}</td>
          <td>${created}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    initTheme();
    loadReportsData();
  </script>
</body>
</html>
