<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --priority-high: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
    }
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 20px;
    }
    h1 { margin: 0; }
    
    /* Modern Control Panel Styles */
    .controls-panel {
      display: flex;
      gap: 15px;
      align-items: flex-end;
      flex-wrap: wrap;
      background-color: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }
    .filter-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .filter-group input[type="date"] {
      background-color: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      height: 38px;
      box-sizing: border-box;
      outline: none;
    }
    .filter-group input[type="date"]:focus {
      border-color: var(--accent);
    }

    /* Custom Checkbox Dropdown */
    .custom-select {
      position: relative;
      width: 180px;
    }
    .select-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      height: 38px;
      box-sizing: border-box;
      user-select: none;
    }
    .select-btn:hover { border-color: #475569; }
    .select-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-top: 4px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      display: none;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .select-dropdown.active { display: block; }
    .select-dropdown label {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      font-size: 0.85rem;
      color: var(--text-main);
      cursor: pointer;
      text-transform: none;
      letter-spacing: normal;
      font-weight: normal;
      transition: background 0.1s;
    }
    .select-dropdown label:hover { background-color: #334155; }
    .select-dropdown input[type="checkbox"] { margin-right: 8px; cursor: pointer; }
    
    /* Custom Scrollbar */
    .select-dropdown::-webkit-scrollbar { width: 6px; }
    .select-dropdown::-webkit-scrollbar-track { background: var(--bg-color); border-radius: 6px; }
    .select-dropdown::-webkit-scrollbar-thumb { background: #475569; border-radius: 6px; }
    
    /* Buttons */
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn-action {
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-action:active { transform: scale(0.98); }
    .btn-export { background-color: #10b981; }
    .btn-export:hover { background-color: #059669; }
    .btn-clear { background-color: #64748b; }
    .btn-clear:hover { background-color: #475569; }

    /* Table Styles */
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    th, td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { background-color: #0f172a; color: var(--text-muted); font-weight: 600; }
    .priority-badge {
      background-color: var(--priority-high);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .dept-badge {
      background-color: #334155;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      border: 1px solid #475569;
    }
    .ticket-link { color: var(--accent); text-decoration: none; font-weight: 600; }
    .ticket-link:hover { text-decoration: underline; }
    .loading-msg { padding: 30px; text-align: center; color: var(--accent); font-size: 1.1rem;}
  </style>
</head>
<body>

  <div class="header-container">
    <h1 id="pageTitle">Loading Tickets...</h1>
    
    <div class="controls-panel">
      <div class="filter-group">
        <label>Start Date</label>
        <input type="date" id="dateStart" onchange="applyLocalFilters()">
      </div>
      <div class="filter-group">
        <label>End Date</label>
        <input type="date" id="dateEnd" onchange="applyLocalFilters()">
      </div>

      <div class="filter-group">
        <label>Assignee</label>
        <div class="custom-select">
          <div class="select-btn" onclick="toggleDropdown('assigneeDropdown')">
            <span id="assigneeLabel">All Assignees</span> ▼
          </div>
          <div class="select-dropdown" id="assigneeDropdown"></div>
        </div>
      </div>
      
      <div class="filter-group">
        <label>Priority</label>
        <div class="custom-select">
          <div class="select-btn" onclick="toggleDropdown('priorityDropdown')">
            <span id="priorityLabel">All Priorities</span> ▼
          </div>
          <div class="select-dropdown" id="priorityDropdown"></div>
        </div>
      </div>

      <div class="filter-group">
        <label>Status</label>
        <div class="custom-select">
          <div class="select-btn" onclick="toggleDropdown('statusDropdown')">
            <span id="statusLabel">All Statuses</span> ▼
          </div>
          <div class="select-dropdown" id="statusDropdown"></div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-action btn-clear" onclick="clearFilters()" title="Reset all filters">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
            <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
          </svg>
          Clear
        </button>
        <button class="btn-action btn-export" onclick="exportToCSV()" title="Download current view">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
            <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
          </svg>
          Export
        </button>
      </div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Ticket #</th>
        <th>Subject</th>
        <th>Priority</th>
        <th>Department</th>
        <th>Assignee</th>
        <th>Status</th>
        <th>Created Date</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="ticketTableBody">
      <tr><td colspan="8" class="loading-msg">Fetching data from Zoho...</td></tr>
    </tbody>
  </table>

  <script>
    // 🔴 IMPORTANT: PASTE YOUR GOOGLE WEB APP URL HERE
    const PROXY_URL = 'https://script.google.com/macros/s/AKfycbxQM4srD1CF0Zj63_CTwBraMp31MyWC1j9RRHoIe9d_RiVmROrYwI-9dO7NNgfa1fe5/exec'; 

    const urlParams = new URLSearchParams(window.location.search);
    const filterType = urlParams.get('filter'); 
    const filterValue = urlParams.get('value');

    // Initial fallback title
    document.getElementById('pageTitle').textContent = filterType === 'all' 
      ? 'All Open Tickets' 
      : `${filterValue} Tickets`;

    let globalTickets = []; 
    let currentFilteredTickets = []; 

    // Close dropdowns when clicking outside
    document.addEventListener('click', function(event) {
      if (!event.target.closest('.custom-select')) {
        document.querySelectorAll('.select-dropdown').forEach(el => el.classList.remove('active'));
      }
    });

    function toggleDropdown(id) {
      document.querySelectorAll('.select-dropdown').forEach(el => {
        if (el.id !== id) el.classList.remove('active');
      });
      document.getElementById(id).classList.toggle('active');
    }

    async function init() {
      try {
        const response = await fetch(PROXY_URL, {
          method: 'GET',
          redirect: 'follow'
        });
        
        const result = await response.json();
        if (!result.data) throw new Error(result.error);
        
        let allTickets = result.data;
        
        // 1. APPLY URL ROUTING (Priority, Department, or Timeframe)
        if (filterType === 'priority') {
          globalTickets = allTickets.filter(t => t.priority === filterValue);
        } else if (filterType === 'department') {
          globalTickets = allTickets.filter(t => (t.department ? t.department.name : 'General') === filterValue);
        } else if (filterType === 'timeframe') {
          
          const today = new Date();
          today.setHours(0,0,0,0);
          
          globalTickets = allTickets.filter(t => {
            const tDate = new Date(t.createdTime);
            
            if (filterValue === 'today') return tDate >= today;
            if (filterValue === 'yesterday') {
              const yest = new Date(today); yest.setDate(yest.getDate() - 1);
              return tDate >= yest && tDate < today;
            }
            if (filterValue === 'last7') {
              const l7 = new Date(today); l7.setDate(l7.getDate() - 7);
              return tDate >= l7;
            }
            if (filterValue === 'currentWeek') {
              const cw = new Date(today); cw.setDate(cw.getDate() - (cw.getDay() || 7) + 1);
              return tDate >= cw;
            }
            if (filterValue === 'lastWeek') {
              const cw = new Date(today); cw.setDate(cw.getDate() - (cw.getDay() || 7) + 1);
              const lw = new Date(cw); lw.setDate(lw.getDate() - 7);
              return tDate >= lw && tDate < cw;
            }
            if (filterValue === 'last30') {
              const l30 = new Date(today); l30.setDate(l30.getDate() - 30);
              return tDate >= l30;
            }
            if (filterValue === 'currentMonth') {
              const cm = new Date(today.getFullYear(), today.getMonth(), 1);
              return tDate >= cm;
            }
            if (filterValue === 'lastMonth') {
              const lmStart = new Date(today.getFullYear(), today.getMonth() - 1, 1);
              const lmEnd = new Date(today.getFullYear(), today.getMonth(), 0, 23, 59, 59);
              return tDate >= lmStart && tDate <= lmEnd;
            }
            return true;
          });

          // Pretty-print the timeframe title dynamically
          const titles = {
            today: "Today's", yesterday: "Yesterday's", last7: "Last 7 Days", 
            currentWeek: "This Week's", lastWeek: "Last Week's", 
            last30: "Last 30 Days", currentMonth: "This Month's", lastMonth: "Last Month's"
          };
          document.getElementById('pageTitle').textContent = `${titles[filterValue] || filterValue} Tickets`;
          
        } else {
          globalTickets = allTickets;
        }

        currentFilteredTickets = [...globalTickets];
        populateFilterDropdowns();
        renderTable(currentFilteredTickets);

      } catch (err) {
        document.getElementById('ticketTableBody').innerHTML = `<tr><td colspan="8" style="color: #ef4444; text-align:center;">Error: ${err.message}</td></tr>`;
      }
    }

    function populateFilterDropdowns() {
      const assignees = new Set();
      const priorities = new Set();
      const statuses = new Set();

      globalTickets.forEach(t => {
        assignees.add(t.assignee ? `${t.assignee.firstName || ''} ${t.assignee.lastName || ''}`.trim() : 'Unassigned');
        priorities.add(t.priority || '-');
        statuses.add(t.status || '-');
      });

      const fillDropdown = (containerId, itemsSet) => {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        Array.from(itemsSet).sort().forEach(val => {
          const label = document.createElement('label');
          label.innerHTML = `<input type="checkbox" value="${val}" onchange="applyLocalFilters()"> ${val}`;
          container.appendChild(label);
        });
      };

      fillDropdown('assigneeDropdown', assignees);
      fillDropdown('priorityDropdown', priorities);
      fillDropdown('statusDropdown', statuses);
    }

    function getCheckedValues(containerId) {
      const checkboxes = document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`);
      return Array.from(checkboxes).map(cb => cb.value);
    }

    function updateLabel(labelId, selectedCount, defaultText) {
      const el = document.getElementById(labelId);
      if (selectedCount === 0) {
        el.textContent = defaultText;
      } else {
        el.textContent = `${selectedCount} Selected`;
      }
    }

    function applyLocalFilters() {
      const selAssignees = getCheckedValues('assigneeDropdown');
      const selPriorities = getCheckedValues('priorityDropdown');
      const selStatuses = getCheckedValues('statusDropdown');
      
      updateLabel('assigneeLabel', selAssignees.length, 'All Assignees');
      updateLabel('priorityLabel', selPriorities.length, 'All Priorities');
      updateLabel('statusLabel', selStatuses.length, 'All Statuses');

      const dateStart = document.getElementById('dateStart').value;
      const dateEnd = document.getElementById('dateEnd').value;

      currentFilteredTickets = globalTickets.filter(ticket => {
        const assigneeName = ticket.assignee ? `${ticket.assignee.firstName || ''} ${ticket.assignee.lastName || ''}`.trim() : 'Unassigned';
        const priority = ticket.priority || '-';
        const status = ticket.status || '-';
        const createdDate = new Date(ticket.createdTime);

        const passAssignee = selAssignees.length === 0 || selAssignees.includes(assigneeName);
        const passPriority = selPriorities.length === 0 || selPriorities.includes(priority);
        const passStatus = selStatuses.length === 0 || selStatuses.includes(status);

        let passDate = true;
        if (dateStart) passDate = passDate && (createdDate >= new Date(dateStart));
        if (dateEnd) {
          const endD = new Date(dateEnd);
          endD.setHours(23, 59, 59);
          passDate = passDate && (createdDate <= endD);
        }

        return passAssignee && passPriority && passStatus && passDate;
      });

      renderTable(currentFilteredTickets);
    }

    function clearFilters() {
      document.getElementById('dateStart').value = '';
      document.getElementById('dateEnd').value = '';
      
      document.querySelectorAll('.select-dropdown input[type="checkbox"]').forEach(cb => {
        cb.checked = false;
      });
      
      applyLocalFilters();
    }

    function renderTable(ticketsToRender) {
      const tableBody = document.getElementById('ticketTableBody');
      tableBody.innerHTML = '';

      if(ticketsToRender.length === 0) {
         tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 40px; color: var(--text-muted);">No tickets match your current filters.</td></tr>`;
         return;
      }

      ticketsToRender.forEach(ticket => {
        const deptName = ticket.department ? ticket.department.name : 'General';
        const priority = ticket.priority || '-';
        const assigneeName = ticket.assignee ? `${ticket.assignee.firstName || ''} ${ticket.assignee.lastName || ''}`.trim() : 'Unassigned';
        const createdDate = ticket.createdTime ? new Date(ticket.createdTime).toLocaleDateString() : '-';
        const deskDirectUrl = `https://helpdesk.mindmatrix.net/support/mindmatrixinc/ShowHomePage.do#Cases/dv/${ticket.id}`;

        const priorityHtml = (priority !== '-') 
          ? `<span class="priority-badge" style="background-color: ${priority === 'Urgent' || priority === 'Critical' ? '#ef4444' : '#f59e0b'};">${priority}</span>` 
          : priority;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>#${ticket.ticketNumber}</td>
          <td><strong>${ticket.subject}</strong></td>
          <td>${priorityHtml}</td>
          <td><span class="dept-badge">${deptName}</span></td>
          <td>${assigneeName}</td>
          <td>${ticket.status}</td>
          <td>${createdDate}</td>
          <td><a href="${deskDirectUrl}" target="_blank" class="ticket-link">Open ↗</a></td>
        `;
        tableBody.appendChild(row);
      });
    }

    function exportToCSV() {
      let csvContent = "\uFEFF"; 
      csvContent += "Ticket #,Subject,Priority,Department,Assignee,Status,Created Date,Ticket Link\n";

      currentFilteredTickets.forEach(ticket => {
        const tNum = ticket.ticketNumber || "";
        const subj = `"${(ticket.subject || "").replace(/"/g, '""')}"`;
        const prio = ticket.priority || "-";
        const dept = ticket.department ? ticket.department.name : "General";
        const assignee = ticket.assignee ? `${ticket.assignee.firstName || ''} ${ticket.assignee.lastName || ''}`.trim() : "Unassigned";
        const status = ticket.status || "";
        const cDate = ticket.createdTime ? new Date(ticket.createdTime).toLocaleDateString() : "";
        const link = `https://helpdesk.mindmatrix.net/support/mindmatrixinc/ShowHomePage.do#Cases/dv/${ticket.id}`;

        csvContent += `${tNum},${subj},${prio},${dept},${assignee},${status},${cDate},${link}\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Zoho_Tickets_Export_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`);
      document.body.appendChild(link);
      
      link.click();
      
      document.body.removeChild(link);
      URL.revokeObjectURL(url); 
    }

    // FIRE EVERYTHING UP!
    init();
  </script>
</body>
</html>
